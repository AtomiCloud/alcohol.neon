version: '3'
includes:
  secret: tasks/Taskfile.secret.yaml

# Run with `task <name>` (or the `pls` alias). Mirrors alcohol.argon's task layout.
tasks:
  # ── Template (AtomiCloud upstream) ───────────────────────────────────────
  setup:
    desc: Setup the repository
    cmds:
      - ./scripts/ci/setup.sh
      - ./scripts/local/secrets.sh
  lint:
    desc: Lints the whole code-base
    cmds:
      - pre-commit run --all-files

  # ── Project-specific (alcohol.neon) ──────────────────────────────────────
  generate:sdk:
    desc: Regenerate the zinc Dart DTOs from its OpenAPI spec (models-only)
    summary: |
      Fetches zinc's OpenAPI spec (default: pichu) and regenerates the Dart DTOs
      under lib/generated/zinc/models via swagger_parser + build_runner.

      The generated Retrofit/dio clients are dropped — we use our own ApiClient
      (Result<T>/Problem). See scripts/generate-sdk.sh.

      Usage: pls generate:sdk -- [SPEC_URL]
    cmds:
      - ./scripts/generate-sdk.sh {{ .CLI_ARGS | default "https://api.zinc.alcohol.pichu.cluster.atomi.cloud/swagger/v1/swagger.json" }}

  register:
    desc: Register Apple App Groups + App IDs for all signing targets (App Manager only)
    summary: |
      Runs scripts/register-apple.sh — creates each landscape's App Group, every
      App ID (app + extensions, auto-discovered from the Xcode project), enables
      the App Groups capability, and associates the group. These portal writes
      have no App Store Connect API — and it now ALSO creates each landscape's
      App Store Connect app record and fills the numeric apple_id into
      lpsm.yaml (commit that diff). Uses fastlane with YOUR Apple ID:
      you sign in once (password + one 2FA prompt), then ALL landscapes are
      processed automatically. The account needs the App Manager/Admin role.
      Idempotent — re-run after adding any widget/extension target. CI verifies
      the result on every release via scripts/ci/doctor-ios.sh.

      Usage: pls register              (all landscapes — the default)
             pls register -- pichu     (one landscape)
    cmds:
      - ./scripts/register-apple.sh {{ .CLI_ARGS }}

  test:
    desc: Run unit tests
    cmds:
      - flutter test
