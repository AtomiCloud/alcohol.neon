name: CD

# Build, sign, and publish all 3 LazyTax (alcohol.neon) flavors on every v*.*.*
# tag (semantic-release cuts these on main) — iOS → TestFlight, Android → Play
# internal. Replaces Codemagic; signing material comes from org-level GitHub
# Actions secrets (synced from Infisical raichu). raichu (prod) uploads to
# TestFlight / Play internal automatically; promotion to the public App Store /
# Play production stays MANUAL.
#
# Per the ci-cd-workflows convention, GitHub Actions is just a task runner: the
# toolchain is served by nix and the imperative build/sign logic lives in
# scripts/ci/cd-*.sh (run inside `nix develop .#cd-ios|.#cd-android`, so
# flutter/Android SDK/JDK/CocoaPods/pipx are all cached). Android restores the shared
# /nix store cache via AtomiCloud/actions.setup-nix; macOS can't mount /nix, so the
# iOS job keeps a local nix binary cache on a Namespace cache volume instead. iOS
# builds go through scripts/flutter-ios.sh, which un-hijacks the nix C/C++ toolchain
# so xcodebuild uses real Xcode (see docs/github-actions-release.md).
#
# Manual runs: use the "Run workflow" button (workflow_dispatch) and pick a
# flavor to smoke-test a single channel without cutting a release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to build (manual runs only)
        type: choice
        default: pichu
        options: [pichu, pikachu, raichu]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: jobs only read the repo (checkout) and upload artifacts.
# Store publishing uses service-account creds, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Compute the build matrix: all 3 flavors on a tag, just the chosen one on a
  # manual run. (matrix can't be referenced in a job-level `if`, so we filter the
  # matrix itself instead of spinning up — and skipping — idle macOS runners.)
  setup:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          SEL: ${{ github.event.inputs.flavor }}
        run: echo "matrix=$(./scripts/ci/cd-matrix.sh)" >> "$GITHUB_OUTPUT"

  # ── iOS → TestFlight ─────────────────────────────────────────────────────────
  ios:
    name: iOS ${{ matrix.flavor }}
    needs: setup
    runs-on:
      - nscloud-macos-sequoia-arm64-6x14-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-darwin-cache
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      FLAVOR: ${{ matrix.flavor }}
      BUNDLE_ID: ${{ matrix.bundle_id }}
      APP_STORE_APPLE_ID: ${{ matrix.apple_id }}
      # codemagic-cli-tools reads these by convention.
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # macOS can't host the Namespace cache volume at /nix itself (on macOS the cache
      # action mounts via symlink, and the sealed APFS root forbids creating /nix — same
      # reason AtomiCloud/actions.setup-nix's Namespace path is Linux-only). Instead,
      # persist a LOCAL nix BINARY CACHE on the volume: warm runs substitute the dev-shell
      # closure from NVMe instead of re-downloading it from cache.nixos.org each run, and
      # the "Push nix store" step below writes new paths back. pub + CocoaPods caches ride
      # the same volume. Must run after checkout; the volume commits only when the job
      # succeeds, and idle volumes expire after ~14 days (first run after a quiet spell is
      # cold again).
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            /tmp/nix-cache
            ~/.pub-cache
            ~/.cocoapods

      # Same installer + substituters as setup-nix's macOS path (which can't take extra
      # substituters — hence inlined), plus the local file:// cache. priority=10 makes the
      # volume win over the remote caches; require-sigs=false because `nix copy`-ed local
      # paths are unsigned; fallback=true skips past cache misses.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            fallback = true
            require-sigs = false
            extra-substituters = file:///tmp/nix-cache?priority=10 https://nix-community.cachix.org?priority=41 https://numtide.cachix.org?priority=42
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= numtide.cachix.org-1:2ps1kLBUWjxIneOy1Ik6cQjb41X0iXVXeHigGmycPPE=

      # App Store Connect requires the iOS 26 SDK (Xcode 26+). The runner's default
      # /Applications/Xcode.app is older (iOS 18 SDK), so point the build at the newest
      # installed Xcode. scripts/flutter-ios.sh + the IPA re-export honour DEVELOPER_DIR_OVERRIDE.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selected $XCODE"
          echo "DEVELOPER_DIR_OVERRIDE=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      # codemagic-cli-tools isn't in nixpkgs; install it with the nix-provided pipx
      # (cached) into ~/.local/bin, then expose it to later steps.
      - name: Install codemagic-cli-tools
        run: |
          set -euo pipefail
          nix develop .#cd-ios -c pipx install codemagic-cli-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build signed IPA
        run: nix develop .#cd-ios -c ./scripts/ci/cd-ios.sh

      # Write the realized dev-shell closure to the cache volume so the next run substitutes
      # it from NVMe. Incremental: paths already in the cache are skipped, so warm runs cost
      # seconds. (The shell is already built by the steps above; `nix build` just prints it.)
      - name: Push nix store to cache volume
        run: |
          set -euo pipefail
          nix copy --to 'file:///tmp/nix-cache?compression=zstd' \
            "$(nix build .#devShells.aarch64-darwin.cd-ios --print-out-paths --no-link)"

      # Upload only (no --testflight): the build lands in TestFlight for INTERNAL testers once
      # Apple finishes processing — no beta-review submission needed. --testflight additionally
      # waits for processing to submit for EXTERNAL beta review, which flakily times out on
      # Apple's side and fails the job even though the upload succeeded. External/public
      # promotion stays a manual gate (see docs/release-strategy.md).
      - name: Publish to TestFlight
        run: app-store-connect publish --path "build/ios/ipa/*.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ matrix.flavor }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn

  # ── Android → Google Play (internal track) ───────────────────────────────────
  android:
    name: Android ${{ matrix.flavor }}
    needs: setup
    # 8 GB runner: cd-android.sh right-sizes the Gradle JVM (the project's dev-machine
    # -Xmx8G would leave no headroom here) and forces Kotlin in-process compilation.
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      FLAVOR: ${{ matrix.flavor }}
      PACKAGE_NAME: ${{ matrix.package_name }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Read by codemagic-cli-tools `google-play` for the versionCode query.
      GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: AtomiCloud/actions.setup-nix@v2

      # codemagic-cli-tools isn't in nixpkgs; install it with the nix-provided pipx
      # (cached) into ~/.local/bin (provides `google-play` for the versionCode query).
      - name: Install codemagic-cli-tools
        run: |
          set -euo pipefail
          nix develop .#cd-android -c pipx install codemagic-cli-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build signed AAB
        run: nix develop .#cd-android -c ./scripts/ci/cd-android.sh

      - name: Publish to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.package_name }}
          releaseFiles: build/app/outputs/bundle/${{ matrix.flavor }}Release/*.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.flavor }}
          path: |
            build/app/outputs/bundle/${{ matrix.flavor }}Release/*.aab
            build/app/outputs/mapping/${{ matrix.flavor }}Release/mapping.txt
          if-no-files-found: warn
