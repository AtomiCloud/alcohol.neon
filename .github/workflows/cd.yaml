name: CD

# Release the 3 flavors on every v*.*.* tag — iOS → TestFlight, Android → Play
# internal; promotion to the public stores stays manual. Shape: one donor build
# per platform (in parallel), staged as run artifacts, then one small publish
# job per landscape (download → stamp → upload, also parallel) — a failed
# upload retries in minutes without rebuilding. A manual dispatch smoke-tests a
# single flavor. See docs/github-actions-release.md.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to publish (manual runs only)
        type: choice
        default: pichu
        options: [pichu, pikachu, raichu]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # All 3 flavors on a tag, just the chosen one on a manual run — filtered in the
  # matrix itself, since a job-level `if` can't reference the matrix.
  setup:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          SEL: ${{ github.event.inputs.flavor }}
        run: echo "matrix=$(./scripts/ci/cd-matrix.sh)" >> "$GITHUB_OUTPUT"

  build-ios:
    name: Build
    uses: ./.github/workflows/⚡reusable-build-ios.yaml
    secrets: inherit

  build-android:
    name: Build
    uses: ./.github/workflows/⚡reusable-build-android.yaml
    secrets: inherit

  publish-ios:
    name: Publish iOS
    needs: [setup, build-ios]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/⚡reusable-publish-ios.yaml
    with:
      flavor: ${{ matrix.flavor }}
    secrets: inherit

  publish-android:
    name: Publish Android
    needs: [setup, build-android]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/⚡reusable-publish-android.yaml
    with:
      flavor: ${{ matrix.flavor }}
      package-name: ${{ matrix.package_name }}
    secrets: inherit
