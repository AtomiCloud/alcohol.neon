# Codemagic CI for LazyTax (alcohol.neon) — 3 apps (one per landscape), Apple + Play.
#
# iOS signing is automatic via the App Store Connect API key integration set up in
# Codemagic Settings -> Integrations as `AtomiCloud App Store Connect`.
#
# All 6 workflows auto-build on `v*.*.*` tags (semantic-release cuts these on main).
# iOS -> TestFlight, Android -> Play internal track. raichu (prod) goes to
# TestFlight/internal automatically too; promotion to the public App Store / Play
# production stays MANUAL (submit_to_app_store: false; track: internal). You can also
# still start any workflow by hand from the Codemagic UI.
#
# Prereq for iOS builds to succeed: the per-flavor Xcode schemes `pichu`/`pikachu`/`raichu`
# must exist (see docs/codemagic-setup.md Part 11).

definitions:
  versions: &versions
    flutter: stable
    xcode: latest
    cocoapods: default

  ios_scripts: &ios_scripts
    - name: Flutter pub get
      script: flutter pub get
    - name: Pod install
      script: find . -name "Podfile" -execdir pod install \;
    - name: Set up code signing (create + fetch the app_store profile)
      script: |
        keychain initialize
        # Create the cert + app_store provisioning profile if they don't exist yet
        # (use-profiles alone only applies already-existing profiles).
        app-store-connect fetch-signing-files "$BUNDLE_ID" \
          --type IOS_APP_STORE \
          --create
        keychain add-certificates
        xcode-project use-profiles
    - name: Build signed IPA
      script: |
        LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" || echo 0)
        BUILD_NUMBER=$(( ${LATEST:-0} + 1 ))
        flutter build ipa --release \
          --flavor "$FLAVOR" \
          --build-number="$BUILD_NUMBER" \
          --export-options-plist=/Users/builder/export_options.plist

  ios_publish: &ios_publish
    app_store_connect:
      auth: integration
      submit_to_testflight: true # upload to TestFlight
      submit_to_app_store: false # never auto-submit to the public App Store (manual gate)
      # beta_groups:                 # uncomment + name TestFlight group(s) once created in ASC
      #   - internal

  android_scripts: &android_scripts
    - name: Flutter pub get
      script: flutter pub get
    - name: Build signed AAB (release keystore via CM_* env vars)
      script: flutter build appbundle --release --flavor "$FLAVOR"

  android_publish: &android_publish
    google_play:
      credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
      track: internal # internal testing track; promote to production in Play Console
      submit_as_draft: false

workflows:
  neon-pichu-ios:
    name: iOS pichu (dev -> TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    integrations:
      app_store_connect: AtomiCloud App Store Connect
    environment:
      <<: *versions
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cloud.atomi.alcohol.neon.pichu
      vars:
        FLAVOR: pichu
        APP_STORE_APPLE_ID: '6777280038'
        BUNDLE_ID: cloud.atomi.alcohol.neon.pichu
    scripts: *ios_scripts
    artifacts:
      - build/ios/ipa/*.ipa
    publishing: *ios_publish

  neon-pikachu-ios:
    name: iOS pikachu (stage -> TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    integrations:
      app_store_connect: AtomiCloud App Store Connect
    environment:
      <<: *versions
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cloud.atomi.alcohol.neon.pikachu
      vars:
        FLAVOR: pikachu
        APP_STORE_APPLE_ID: '6777280047'
        BUNDLE_ID: cloud.atomi.alcohol.neon.pikachu
    scripts: *ios_scripts
    artifacts:
      - build/ios/ipa/*.ipa
    publishing: *ios_publish

  neon-raichu-ios:
    name: iOS raichu (prod -> TestFlight; promote to App Store manually)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    integrations:
      app_store_connect: AtomiCloud App Store Connect
    environment:
      <<: *versions
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cloud.atomi.alcohol.neon.raichu
      vars:
        FLAVOR: raichu
        APP_STORE_APPLE_ID: '6777280099'
        BUNDLE_ID: cloud.atomi.alcohol.neon.raichu
    scripts: *ios_scripts
    artifacts:
      - build/ios/ipa/*.ipa
    publishing: *ios_publish

  # ── Android → Google Play (internal track) ────────────────────────────────
  # Requires (Codemagic Settings): an Android keystore named `atomi_upload_keystore`
  # and a variable group `google_play` holding GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS.
  neon-pichu-android:
    name: Android pichu (dev -> Play internal)
    instance_type: linux_x2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    environment:
      flutter: stable
      android_signing:
        - atomi_upload_keystore
      groups:
        - google_play
      vars:
        FLAVOR: pichu
    scripts: *android_scripts
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/mapping/**/mapping.txt
    publishing: *android_publish

  neon-pikachu-android:
    name: Android pikachu (stage -> Play internal)
    instance_type: linux_x2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    environment:
      flutter: stable
      android_signing:
        - atomi_upload_keystore
      groups:
        - google_play
      vars:
        FLAVOR: pikachu
    scripts: *android_scripts
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/mapping/**/mapping.txt
    publishing: *android_publish

  neon-raichu-android:
    name: Android raichu (prod -> Play internal; promote in Play Console)
    instance_type: linux_x2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    environment:
      flutter: stable
      android_signing:
        - atomi_upload_keystore
      groups:
        - google_play
      vars:
        FLAVOR: raichu
    scripts: *android_scripts
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/mapping/**/mapping.txt
    publishing: *android_publish

# ── Triggers ─────────────────────────────────────────────────────────────────
# All 6 workflows auto-build on `v*.*.*` tags (semantic-release cuts these on main).
# No RC tags. To stop a flavor from auto-building, remove its `triggering:` block.
#
# ── Promotion (stays manual) ─────────────────────────────────────────────────
# raichu iOS uploads to TestFlight but never auto-submits to the public App Store
# (submit_to_app_store: false) — promote it by hand in App Store Connect.
#
# ── Android / Play notes ────────────────────────────────────────────────────
# All 3 Android workflows publish to the Play **internal** track. To ship raichu
# to production, change its workflow's `track: internal` -> `production` (add
# `submit_as_draft: true` to release manually), or promote the build in the Play
# Console. First upload to a new Play app sometimes must be done manually before
# the API will accept automated uploads.
