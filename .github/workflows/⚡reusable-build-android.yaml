name: ⚡ Reusable Build Android

# Build the donor AAB (debug-signed raichu release; scripts/ci/cd-android.sh —
# no secrets needed, the publish jobs re-sign with the upload key) and stage it
# as this run's `aab` artifact for the per-landscape publish jobs.
# See docs/github-actions-release.md.

on:
  workflow_call: {}

jobs:
  build:
    name: Build AAB
    # Keep cd-android.sh's conservative Gradle JVM sizing on GitHub-hosted Ubuntu.
    runs-on: ubuntu-22.04
    # Namespace runners (disabled):
    # runs-on:
    #   - nscloud-ubuntu-22.04-amd64-4x8-with-cache
    #   - nscloud-cache-size-50gb
    #   - nscloud-cache-tag-atomi-nix-store-cache
    timeout-minutes: 60
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'

      # Namespace caching disabled; build without the optional Gradle cache.
      # - uses: AtomiCloud/actions.cache-gradle@v1

      - name: Build donor AAB
        run: nix develop .#cd-android -c ./scripts/ci/cd-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: |
            build/app/outputs/bundle/raichuRelease/*.aab
            build/app/outputs/mapping/raichuRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14
