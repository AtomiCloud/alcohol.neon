name: ⚡ Reusable CD Android

# Build, sign, and publish one Android flavor to the Play internal track. Secrets
# come from the caller via `secrets: inherit`. See docs/github-actions-release.md.

on:
  workflow_call:
    inputs:
      flavor:
        description: Flutter flavor (pichu | pikachu | raichu)
        required: true
        type: string
      package-name:
        description: Play applicationId (for get-latest-build-number)
        required: true
        type: string

jobs:
  android:
    name: Android ${{ inputs.flavor }}
    # 8 GB runner — cd-android.sh sizes the Gradle JVM for it.
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache
    timeout-minutes: 60
    env:
      FLAVOR: ${{ inputs.flavor }}
      PACKAGE_NAME: ${{ inputs.package-name }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Read by codemagic-cli-tools `google-play` for the versionCode query.
      GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3

      # Not in nixpkgs; provides `google-play` for the versionCode query.
      - name: Install codemagic-cli-tools
        run: |
          set -euo pipefail
          nix develop .#cd-android -c pipx install codemagic-cli-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build signed AAB
        run: nix develop .#cd-android -c ./scripts/ci/cd-android.sh

      - name: Publish to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package-name }}
          releaseFiles: build/app/outputs/bundle/${{ inputs.flavor }}Release/*.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        with:
          name: aab-${{ inputs.flavor }}
          path: |
            build/app/outputs/bundle/${{ inputs.flavor }}Release/*.aab
            build/app/outputs/mapping/${{ inputs.flavor }}Release/mapping.txt
          if-no-files-found: warn
