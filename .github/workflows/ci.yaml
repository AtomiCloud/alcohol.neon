name: CI
on:
  push:
    # Branches only — a tag push already triggers CD; a duplicate CI run on
    # the same commit would just re-lint it.
    branches: ['**']
jobs:
  precommit:
    name: Pre-Commit
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit
  test:
    name: Test
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
