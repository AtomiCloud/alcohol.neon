name: ⚡ Reusable Publish Android

# Stamp the donor AAB into ONE landscape's release (scripts/ci/
# publish-android.sh — re-signs with the upload key) and roll it out to the
# Play internal track. One call per landscape — uploads run in parallel and
# each retries without rebuilding. Secrets come from the caller via
# `secrets: inherit`. See docs/github-actions-release.md.

on:
  workflow_call:
    inputs:
      flavor:
        description: Landscape to stamp + publish (pichu | pikachu | raichu)
        required: true
        type: string
      package-name:
        description: Play applicationId (upload-google-play can't run yq)
        required: true
        type: string

jobs:
  publish:
    name: Play ${{ inputs.flavor }}
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache
    timeout-minutes: 30
    env:
      FLAVOR: ${{ inputs.flavor }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Read by codemagic-cli-tools `google-play` for the versionCode query.
      GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3

      - uses: actions/download-artifact@v4
        with:
          name: aab
          path: donor

      - name: Stamp ${{ inputs.flavor }}
        run: |
          set -euo pipefail
          nix develop .#cd-android -c ./scripts/ci/publish-android.sh "$FLAVOR" "$(find donor -name '*.aab' | head -1)"

      - name: Publish to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package-name }}
          releaseFiles: build/app/outputs/stamped/${{ inputs.flavor }}.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        with:
          name: aab-${{ inputs.flavor }}
          path: build/app/outputs/stamped/*.aab
          if-no-files-found: warn
          retention-days: 14
