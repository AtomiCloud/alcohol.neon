name: Release

# On every push to main, without re-running CI there (see ci.yaml): the PR's CI
# already passed on the same tree.
on:
  push:
    branches: [main]

concurrency:
  group: release

jobs:
  release:
    name: Semantic Release
    # Skip the release commit semantic-release itself pushes.
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    uses: ./.github/workflows/⚡reusable-release.yaml
    secrets: inherit
