# XcodeGen project definition — the SOURCE OF TRUTH for the Xcode project.
# The .xcodeproj is generated and git-ignored. Regenerate with: `xcodegen generate`
# (or `task generate`). Edit THIS file, not the .xcodeproj.
name: AlcoholNeon

options:
  bundleIdPrefix: cloud.atomi.alcohol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Logto:
    url: https://github.com/logto-io/swift.git
    from: "1.0.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # TODO: set your Apple Developer Team ID for device signing
    CODE_SIGN_STYLE: Automatic

targets:
  AlcoholNeon:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: Logto
        product: Logto
      - package: Logto
        product: LogtoClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.atomi.alcohol.neon
        INFOPLIST_KEY_CFBundleDisplayName: LazyTax
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: LazyTax
        UILaunchScreen: {}
        # ASWebAuthenticationSession intercepts this scheme during Logto sign-in.
        # Must match AppConfig.redirectUri and the Native app's redirect URI in Logto.
        CFBundleURLTypes:
          - CFBundleURLName: cloud.atomi.alcohol.neon
            CFBundleURLSchemes:
              - cloud.atomi.alcohol.neon
