name: ⚡ Reusable CD Android

# Build ONE release AAB, stamp it per landscape (scripts/ci/stamp-android.sh),
# publish each to its Play internal track. One runner instead of a 3-job matrix —
# the Dart/native payload is identical across landscapes, only packaging differs.
# Secrets come from the caller via `secrets: inherit`. See docs/github-actions-release.md.

on:
  workflow_call:
    inputs:
      landscapes:
        description: Space-separated landscapes to stamp + publish (e.g. "pichu pikachu raichu")
        required: true
        type: string

jobs:
  android:
    name: Android ${{ inputs.landscapes }}
    # 8 GB runner — cd-android.sh sizes the Gradle JVM for it.
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache
    timeout-minutes: 60
    env:
      LANDSCAPES: ${{ inputs.landscapes }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Read by codemagic-cli-tools `google-play` for the versionCode query.
      GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3

      # Not in nixpkgs; provides `google-play` for the versionCode query.
      - name: Install codemagic-cli-tools
        run: |
          set -euo pipefail
          nix develop .#cd-android -c pipx install codemagic-cli-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build once, stamp per landscape
        run: nix develop .#cd-android -c ./scripts/ci/cd-android.sh

      # Package names below are LPSM literals (cloud.atomi.<landscape>.alcohol.neon.app,
      # docs/developer/standard/bundle-id.md) — workflow `with:` blocks can't run yq.
      - name: Publish pichu to Play internal track
        if: contains(inputs.landscapes, 'pichu')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cloud.atomi.pichu.alcohol.neon.app
          releaseFiles: build/app/outputs/stamped/pichu.aab
          track: internal
          status: completed

      - name: Publish pikachu to Play internal track
        if: contains(inputs.landscapes, 'pikachu')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cloud.atomi.pikachu.alcohol.neon.app
          releaseFiles: build/app/outputs/stamped/pikachu.aab
          track: internal
          status: completed

      - name: Publish raichu to Play internal track
        if: contains(inputs.landscapes, 'raichu')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cloud.atomi.raichu.alcohol.neon.app
          releaseFiles: build/app/outputs/stamped/raichu.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        with:
          name: aab-stamped
          path: |
            build/app/outputs/stamped/*.aab
            build/app/outputs/mapping/raichuRelease/mapping.txt
          if-no-files-found: warn
