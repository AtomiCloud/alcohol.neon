name: ⚡ Reusable Donor Android

# Build the donor AAB (raichu, debug-signed, placeholder version fields) on
# every main push and upload it as the `donor-android` artifact — CD pulls it
# by commit SHA at tag time and only stamps (which re-signs with the upload
# key) + publishes. Needs no signing secrets. See docs/github-actions-release.md.

on:
  workflow_call: {}

jobs:
  donor:
    name: Donor Android
    # 8 GB runner — cd-android.sh sizes the Gradle JVM for it.
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache
    timeout-minutes: 60
    env:
      BUILD_ONLY: '1'
      LANDSCAPES: ''
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3

      - name: Build donor AAB
        run: nix develop .#cd-android -c ./scripts/ci/cd-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: donor-android
          path: |
            build/app/outputs/bundle/raichuRelease/*.aab
            build/app/outputs/mapping/raichuRelease/mapping.txt
          if-no-files-found: error
