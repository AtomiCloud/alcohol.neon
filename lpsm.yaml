# LPSM service tree — the single source of truth for store identifiers.
# Grammar (docs/developer/standard/bundle-id.md):
#   bundle id == Android applicationId == cloud.atomi.<landscape>.<platform>.<service>[.<module>]
#   App Group == group.<app bundle id>       Logto redirect == <app bundle id>://callback
#
# Consumers: scripts/ci/cd-matrix.sh (CD build matrix), scripts/register-apple.sh
# (pls register), scripts/ci/lpsm-lint.sh (pre-commit drift check for the files
# that must carry literals: pbxproj, gradle, pubspec, config yamls).

domain: atomi.cloud
platform: alcohol
service: neon

# Apple Developer portal team (signing) — pls register refuses other teams.
apple_team: SY4WNY5G7U

# Base App Store name: prod (raichu) bare, other landscapes suffixed below.
app_name: LazyTax

# Release landscapes, in matrix order.
# - store_suffix: appended to app_name for the STORE LISTING name. Automated
#   for the App Store (pls register creates the ASC record with it); Google
#   Play apps are created manually — use the same name there for parity. The
#   under-the-icon display name is separate on purpose (xcconfig
#   BUNDLE_DISPLAY_NAME / gradle appName) and stays short.
# - apple_id: numeric App Store Connect app id — filled automatically by
#   `pls register` once the app record exists (commit the diff it writes here).
landscapes:
  - name: pichu
    store_suffix: ' (Pichu)'
    apple_id: ''
  - name: pikachu
    store_suffix: ' (Pikachu)'
    apple_id: ''
  - name: raichu
    store_suffix: ': Stake Habits'
    apple_id: ''
