# Base config — inherited by EVERY landscape, and the effective config for
# `lapras` (local dev, which has no file of its own). The per-landscape files
# (pichu/pikachu/raichu) override these keys; any key can also be overridden at
# build time via --dart-define (NEON_ZINC_URL, NEON_LOGTO_ENDPOINT,
# NEON_LOGTO_APP_ID, NEON_ZINC_RESOURCE, NEON_AIRWALLEX_ENV).

zincBaseUrl: 'http://localhost:9003'
# Base URL written onto physical NFC habit tags (always the frozen tag domain,
# served by alcohol.helium — its AASA/assetlinks list every flavor's app id, so
# any landscape's app opens the same tag; the tag id then resolves against that
# app's own zinc).
nfcTagBaseUrl: 'https://t.lazytax.club/t/'
logtoEndpoint: 'http://localhost:3301/'
logtoAppId: 'REPLACE_WITH_NATIVE_LOGTO_APP_ID'
zincResource: 'https://api.zinc.alcohol.lapras'
airwallexEnv: 'demo'
redirectUri: 'cloud.atomi.lapras.alcohol.neon.app://callback'
scopes:
  - openid
  - profile
  - offline_access
  - email
  - admin
  - active
