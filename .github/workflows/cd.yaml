name: CD

# Build, sign, and publish all 3 LazyTax (alcohol.neon) flavors on every v*.*.*
# tag (semantic-release cuts these on main) — iOS → TestFlight, Android → Play
# internal. Replaces Codemagic; signing material comes from org-level GitHub
# Actions secrets (synced from Infisical raichu). raichu (prod) uploads to
# TestFlight / Play internal automatically; promotion to the public App Store /
# Play production stays MANUAL.
#
# Per the ci-cd-workflows convention, GitHub Actions is just a task runner: the
# imperative build/sign logic lives in scripts/ci/cd-*.sh and is runnable locally
# (these mobile jobs deliberately run OUTSIDE the nix shell — a sanctioned
# exception; nix hijacks the C/C++ toolchain. See docs/github-actions-release.md).
#
# Manual runs: use the "Run workflow" button (workflow_dispatch) and pick a
# flavor to smoke-test a single channel without cutting a release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to build (manual runs only)
        type: choice
        default: pichu
        options: [pichu, pikachu, raichu]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: jobs only read the repo (checkout) and upload artifacts.
# Store publishing uses service-account creds, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Compute the build matrix: all 3 flavors on a tag, just the chosen one on a
  # manual run. (matrix can't be referenced in a job-level `if`, so we filter the
  # matrix itself instead of spinning up — and skipping — idle macOS runners.)
  setup:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          SEL: ${{ github.event.inputs.flavor }}
        run: echo "matrix=$(./scripts/ci/cd-matrix.sh)" >> "$GITHUB_OUTPUT"

  # ── iOS → TestFlight ─────────────────────────────────────────────────────────
  ios:
    name: iOS ${{ matrix.flavor }}
    needs: setup
    runs-on: nscloud-macos-sequoia-arm64-6x14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      FLAVOR: ${{ matrix.flavor }}
      BUNDLE_ID: ${{ matrix.bundle_id }}
      APP_STORE_APPLE_ID: ${{ matrix.apple_id }}
      # codemagic-cli-tools reads these by convention.
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # macOS ships openrsync, which ignores --chmod → read-only Flutter.framework
      # → lipo fails. GNU rsync (Homebrew) fixes it; put it ahead of /usr/bin.
      # pipx is needed to install codemagic-cli-tools (not preinstalled on the runner).
      - name: Install GNU rsync + pipx
        run: |
          set -euo pipefail
          brew install rsync pipx
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install codemagic-cli-tools
        run: pipx install codemagic-cli-tools

      - name: Build signed IPA
        run: ./scripts/ci/cd-ios.sh

      - name: Publish to TestFlight
        run: app-store-connect publish --path "build/ios/ipa/*.ipa" --testflight

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ matrix.flavor }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn

  # ── Android → Google Play (internal track) ───────────────────────────────────
  android:
    name: Android ${{ matrix.flavor }}
    needs: setup
    runs-on:
      - nscloud-ubuntu-22.04-amd64-32x64-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      FLAVOR: ${{ matrix.flavor }}
      PACKAGE_NAME: ${{ matrix.package_name }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Read by codemagic-cli-tools `google-play` for the versionCode query.
      GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3

      # codemagic-cli-tools provides `google-play get-latest-build-number` (used by
      # cd-android.sh to compute versionCode). pipx isn't preinstalled on the Linux runner.
      - name: Install codemagic-cli-tools
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y pipx
          pipx install codemagic-cli-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build signed AAB
        run: ./scripts/ci/cd-android.sh

      - name: Publish to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.package_name }}
          releaseFiles: build/app/outputs/bundle/${{ matrix.flavor }}Release/*.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.flavor }}
          path: |
            build/app/outputs/bundle/${{ matrix.flavor }}Release/*.aab
            build/app/outputs/mapping/${{ matrix.flavor }}Release/mapping.txt
          if-no-files-found: warn
