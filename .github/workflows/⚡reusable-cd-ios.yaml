name: ⚡ Reusable CD iOS

# Build ONE signed IPA (raichu donor), stamp it per landscape
# (scripts/ci/stamp-ios.sh), publish each to TestFlight. One macOS runner
# instead of a 3-job matrix — the compiled app is landscape-agnostic, only
# packaging differs. Secrets come from the caller via `secrets: inherit`.
# See docs/github-actions-release.md.

on:
  workflow_call:
    inputs:
      landscapes:
        description: Space-separated landscapes to stamp + publish (e.g. "pichu pikachu raichu")
        required: true
        type: string

jobs:
  ios:
    name: iOS ${{ inputs.landscapes }}
    runs-on:
      - nscloud-macos-sequoia-arm64-6x14-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-darwin-cache
    timeout-minutes: 90
    env:
      LANDSCAPES: ${{ inputs.landscapes }}
      # codemagic-cli-tools reads these by convention.
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      # On macOS, setup-nix serves nix from a file:// cache on the Namespace cache
      # volume — requires the -with-cache runner labels above.
      - uses: AtomiCloud/actions.setup-nix@v3

      # Must run after checkout (done by setup-nix).
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ~/.pub-cache
            ~/.cocoapods

      # App Store Connect requires the newest SDK; the runner's default Xcode is older.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selected $XCODE"
          echo "DEVELOPER_DIR_OVERRIDE=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build once, stamp per landscape
        run: nix develop .#cd-ios -c ./scripts/ci/cd-ios.sh

      # No --testflight: it waits on Apple processing to submit for EXTERNAL beta review
      # and flakily times out; internal testers get the build from a plain upload.
      - name: Publish to TestFlight
        run: |
          set -euo pipefail
          # Attempt every landscape even if one upload fails (raichu — prod —
          # globs last); fail the step at the end if any did.
          fail=0
          for ipa in build/ios/stamped/*.ipa; do
            nix develop .#cd-ios -c app-store-connect publish --path "$ipa" || fail=1
          done
          exit "$fail"

      - uses: actions/upload-artifact@v7
        with:
          name: ipa-stamped
          path: build/ios/stamped/*.ipa
          if-no-files-found: warn
