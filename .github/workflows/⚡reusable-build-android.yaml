name: ⚡ Reusable Build Android

# Build the donor AAB (debug-signed raichu release; scripts/ci/cd-android.sh —
# no secrets needed, the publish jobs re-sign with the upload key) and stage it
# as this run's `aab` artifact for the per-landscape publish jobs.
# See docs/github-actions-release.md.

on:
  workflow_call: {}
  # Smoke-test the donor build on any branch without cutting a release or
  # touching a store (it holds no secrets and only uploads a run artifact).
  workflow_dispatch: {}

jobs:
  build:
    name: Build AAB
    # Keep cd-android.sh's conservative Gradle JVM sizing on GitHub-hosted Ubuntu.
    runs-on: ubuntu-22.04
    # Namespace runners (disabled):
    # runs-on:
    #   - nscloud-ubuntu-22.04-amd64-4x8-with-cache
    #   - nscloud-cache-size-50gb
    #   - nscloud-cache-tag-atomi-nix-store-cache
    # A cold toolchain download plus a cold Gradle build; 60 minutes cancelled
    # v1.15.2 five minutes into Gradle.
    timeout-minutes: 120
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
          # Everything .#build-android needs is on cache.nixos.org (Flutter, JDK) or
          # built from Google's SDK zips (androidsdk isn't in any binary cache), so
          # attic only adds stalling downloads here.
          attic: 'false'

      # Gradle dependencies and its build cache (cd-android.sh turns caching on).
      # Caches from a tag run are only visible to that tag, so this mainly speeds
      # up re-runs of a failed release.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build donor AAB
        run: nix develop .#build-android -c ./scripts/ci/cd-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: |
            build/app/outputs/bundle/raichuRelease/*.aab
            build/app/outputs/mapping/raichuRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14
