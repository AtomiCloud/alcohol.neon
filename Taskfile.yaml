version: '3'
includes:
  secret: tasks/Taskfile.secret.yaml

# Run with `task <name>` (or the `pls` alias). Mirrors alcohol.argon's task layout.
tasks:
  # ── Template (AtomiCloud upstream) ───────────────────────────────────────
  setup:
    desc: Setup the repository
    cmds:
      - ./scripts/ci/setup.sh
      - ./scripts/local/secrets.sh
  lint:
    desc: Lints the whole code-base
    cmds:
      - pre-commit run --all-files

  # ── Project-specific (alcohol.neon) ──────────────────────────────────────
  generate:sdk:
    desc: Regenerate the zinc Dart DTOs from its OpenAPI spec (models-only)
    summary: |
      Fetches zinc's OpenAPI spec (default: pichu) and regenerates the Dart DTOs
      under lib/generated/zinc/models via swagger_parser + build_runner.

      The generated Retrofit/dio clients are dropped — we use our own ApiClient
      (Result<T>/Problem). See scripts/generate-sdk.sh.

      Usage: pls generate:sdk -- [SPEC_URL]
    cmds:
      - ./scripts/generate-sdk.sh {{ .CLI_ARGS | default "https://api.zinc.alcohol.pichu.cluster.atomi.cloud/swagger/v1/swagger.json" }}

  test:
    desc: Run unit tests
    cmds:
      - flutter test
