name: CD

# Build, sign, and publish the 3 flavors on every v*.*.* tag — iOS → TestFlight,
# Android → Play internal; promotion to the public stores stays manual. A manual
# dispatch smoke-tests a single flavor. See docs/github-actions-release.md.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to build (manual runs only)
        type: choice
        default: pichu
        options: [pichu, pikachu, raichu]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # All 3 flavors on a tag, just the chosen one on a manual run — filtered in the
  # matrix itself, since a job-level `if` can't reference the matrix.
  setup:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      landscapes: ${{ steps.set.outputs.landscapes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          SEL: ${{ github.event.inputs.flavor }}
        run: |
          set -euo pipefail
          MATRIX=$(./scripts/ci/cd-matrix.sh)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          # Android runs as ONE job that stamps every landscape (build-once model)
          # and takes the flat list instead of the matrix.
          echo "landscapes=$(echo "$MATRIX" | jq -r '[.include[].flavor] | join(" ")')" >> "$GITHUB_OUTPUT"

  # One job per platform: build once, stamp + publish every landscape
  # (scripts/ci/stamp-ios.sh / stamp-android.sh).
  ios:
    name: iOS
    needs: setup
    uses: ./.github/workflows/⚡reusable-cd-ios.yaml
    with:
      landscapes: ${{ needs.setup.outputs.landscapes }}
    secrets: inherit

  android:
    name: Android
    needs: setup
    uses: ./.github/workflows/⚡reusable-cd-android.yaml
    with:
      landscapes: ${{ needs.setup.outputs.landscapes }}
    secrets: inherit
