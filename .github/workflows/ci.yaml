name: CI
on:
  push:
    # Branches only — a tag push already triggers CD; a duplicate CI run on
    # the same commit would just re-lint it. Not main either: main only takes
    # PRs that must be up to date with it, so a merge commit has the exact tree
    # its PR's CI already passed. Release runs on the push to main directly.
    branches: ['**', '!main']
jobs:
  precommit:
    name: Pre-Commit
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit
  test:
    name: Test
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
